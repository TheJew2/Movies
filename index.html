<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movies</title>
<style>
  :root { --bg: #0b0b10; --panel: #15151d; --border: #2a2a38; --accent: #9300ee; --muted: #aaa; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: #fff; }
  button { font: inherit; color: #fff; cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0; }
  input[type=text] { background: var(--panel); color: #fff; border: 1px solid var(--border); border-radius: 999px;
                     padding: 10px 16px; font: inherit; min-width: 0; flex: 1; max-width: 420px; }
  input[type=text]:focus { outline: 2px solid var(--accent); }
  .btn { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; transition: .2s; white-space: nowrap; }
  .btn:hover, .btn.on { background: var(--accent); border-color: var(--accent); }

  /* Home */
  #home { height: 100%; overflow-y: auto; padding: 28px 28px 40px; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-weight: 300; letter-spacing: 4px; color: var(--accent); font-size: 24px; margin-right: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px; align-items: start; }
  .grid > .empty { grid-column: 1 / -1; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); border: 2px dashed var(--border); border-radius: 14px; }
  .card button { display: block; width: 100%; padding: 0; background: none; border: 0; text-align: left; border-radius: 10px; }
  .poster, .poster-fallback { display: flex; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px;
            background: linear-gradient(135deg, #32104b, #171721 70%); transition: transform .16s ease, box-shadow .16s ease; }
  .poster-fallback { align-items: center; justify-content: center; color: #c084fc; }
  .poster-fallback svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .card button:hover .poster, .card button:focus-visible .poster,
  .card button:hover .poster-fallback, .card button:focus-visible .poster-fallback {
    transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,.4); outline: 2px solid var(--accent); outline-offset: 2px; }
  .name { display: block; margin-top: 10px; font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .meta { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }

  /* Player */
  #player { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--panel); border-bottom: 2px solid var(--accent); }
  #title { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-weight: 600; }
  .stage { flex: 1; min-height: 0; background: #000; }
  .stage video, .stage iframe { width: 100%; height: 100%; border: 0; background: #000; display: block; }
  #eps { max-height: 32vh; overflow-y: auto; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border); }
  #eps button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 8px 10px; background: none; border: 0; border-radius: 8px; }
  #eps button:hover { background: var(--bg); }
  #eps .cur { background: rgba(147, 0, 238, .25); color: #d9a8ff; font-weight: 600; }
  #eps .n { color: var(--muted); width: 28px; text-align: right; flex: none; }

  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #fff; color: #0b0b10;
           padding: 8px 16px; border-radius: 999px; font-size: 14px; z-index: 50; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; }
  #toast.show { opacity: 1; }

  @media (max-width: 700px) {
    #home { padding: 18px 12px 30px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 14px; }
  }
</style>
</head>
<body>

<div id="home">
  <header class="top">
    <h1>MOVIES</h1>
    <input type="text" id="search" placeholder="Search movies" aria-label="Search movies">
    <button class="btn" id="refresh" title="Rescan Drive folder">Refresh</button>
  </header>
  <ul id="grid" class="grid"></ul>
</div>

<div id="player" hidden>
  <div class="bar">
    <button class="btn" id="back">&larr; Back</button>
    <span id="title"></span>
    <button class="btn" id="driveBtn" title="Switch between the built-in player and Google Drive's own player">Drive player</button>
  </div>
  <div class="stage">
    <video id="video" controls playsinline></video>
    <iframe id="drive" hidden allow="autoplay; fullscreen" allowfullscreen></iframe>
  </div>
  <ul id="eps" hidden></ul>
</div>

<div id="toast"></div>

<script>
// ---------- SETUP: change these two lines ----------
const DRIVE_API_KEY = 'AIzaSyDRYG2KTXbW0OsM7aufSfUi_NdaV_Iwe_I';
const MOVIES_ROOT_FOLDER_ID = 'PASTE_MOVIES_FOLDER_ID_HERE';
// ---------------------------------------------------
//
// Drive layout (both work, mix them freely):
//   Movies/Some Movie.mp4
//   Movies/Some Movie/Some Movie.mp4        (+ poster.jpg, + subtitles .vtt/.srt)
//   Movies/Some Show/S01E01.mp4, S01E02.mp4 (several videos in a folder = episode list)

const $ = (id) => document.getElementById(id);
const video = $('video');
const KEY = encodeURIComponent(DRIVE_API_KEY);
const VIDEO_RE = /\.(mp4|m4v|webm|mov|mkv|ogv)$/i;
const isFolder = (f) => f.mimeType === 'application/vnd.google-apps.folder';
const isVideo = (f) => !isFolder(f) && ((f.mimeType || '').startsWith('video/') || VIDEO_RE.test(f.name || ''));
const isPoster = (f) => /^(thumbnail|poster|cover|folder)(\.(jpe?g|png|webp|gif|avif))?$/i.test((f.name || '').trim());
const isImage = (f) => !isFolder(f) && ((f.mimeType || '').startsWith('image/') || /\.(jpe?g|png|webp|gif|avif)$/i.test(f.name || ''));
const isSub = (f) => /\.(vtt|srt)$/i.test(f.name || '');
const natural = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
const fileTitle = (n) => (n || 'Untitled').replace(/\.[^.]+$/, '').replace(/_/g, ' ');
const norm = (s) => String(s || '').normalize('NFKD').toLowerCase().replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

let entries = [];
let current = null, epIndex = 0, urlIdx = 0, useDrive = false;
let loading = false, loadError = '';
let subToken = 0, blobUrls = [];
let toastTimer;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// ---------- Saved watch positions ----------
const STORE_KEY = 'moviePlayer.v1';
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
function savePos(id, t) {
  try {
    const s = loadStore();
    s.pos = s.pos || {};
    if (t == null) delete s.pos[id]; else s.pos[id] = Math.floor(t);
    localStorage.setItem(STORE_KEY, JSON.stringify(s));
  } catch (e) {}
}
const getPos = (id) => (loadStore().pos || {})[id] || 0;

// ---------- Drive API ----------
async function driveList(folderId) {
  const all = [];
  let pageToken = '';
  do {
    const p = new URLSearchParams({
      q: "'" + folderId.replace(/'/g, "\\'") + "' in parents and trashed = false",
      fields: 'nextPageToken,files(id,name,mimeType,thumbnailLink)',
      pageSize: '1000', orderBy: 'name_natural',
      supportsAllDrives: 'true', includeItemsFromAllDrives: 'true', key: DRIVE_API_KEY,
    });
    if (pageToken) p.set('pageToken', pageToken);
    const r = await fetch('https://www.googleapis.com/drive/v3/files?' + p);
    let data = {};
    try { data = await r.json(); } catch (_) {}
    if (!r.ok) throw new Error((data.error && data.error.message) || 'Google Drive API request failed (' + r.status + ').');
    all.push(...(data.files || []));
    pageToken = data.nextPageToken || '';
  } while (pageToken);
  return all;
}

async function mapLimit(items, limit, fn) {
  let next = 0;
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (next < items.length) { const i = next++; await fn(items[i], i); }
  }));
}

const posterUrls = (f) => f ? [
  'https://drive.google.com/thumbnail?id=' + encodeURIComponent(f.id) + '&sz=w600',
  'https://drive.google.com/uc?export=view&id=' + encodeURIComponent(f.id),
  'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(f.id) + '?alt=media&key=' + KEY,
] : [];

async function scan() {
  const root = await driveList(MOVIES_ROOT_FOLDER_ID);
  const out = [];
  root.filter(isVideo).forEach((f) => out.push({
    id: f.id, name: fileTitle(f.name), videos: [f], subs: [],
    posters: f.thumbnailLink ? [f.thumbnailLink] : [],
  }));
  await mapLimit(root.filter(isFolder), 4, async (folder) => {
    const kids = await driveList(folder.id);
    const vids = kids.filter(isVideo).sort(natural);
    if (!vids.length) return;
    const poster = kids.find(isPoster) || kids.find(isImage);
    out.push({
      id: folder.id, name: folder.name, videos: vids, subs: kids.filter(isSub),
      posters: poster ? posterUrls(poster) : (vids[0].thumbnailLink ? [vids[0].thumbnailLink] : []),
    });
  });
  return out.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
}

async function load(force) {
  if (loading) return;
  if (!DRIVE_API_KEY || MOVIES_ROOT_FOLDER_ID.includes('PASTE_')) {
    loadError = 'Set MOVIES_ROOT_FOLDER_ID near the top of the script, then reload.';
    renderGrid(); return;
  }
  loading = true; loadError = '';
  renderGrid();
  try { entries = await scan(); }
  catch (e) {
    loadError = (e && e.message ? e.message : 'Could not load the Drive folder.') +
      ' Check that the Drive API is enabled, the key allows this site, and the folder is shared with "Anyone with the link".';
  }
  loading = false;
  renderGrid();
}

// ---------- Home grid ----------
const FILM_SVG = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>';
function placeholder() {
  const d = document.createElement('div');
  d.className = 'poster-fallback';
  d.innerHTML = FILM_SVG;
  return d;
}
function posterEl(e) {
  const urls = e.posters || [];
  if (!urls.length) return placeholder();
  const img = document.createElement('img');
  img.className = 'poster';
  img.alt = e.name + ' poster';
  img.loading = 'lazy';
  let i = 0;
  img.onerror = () => { i++; if (i < urls.length) img.src = urls[i]; else img.replaceWith(placeholder()); };
  img.src = urls[0];
  return img;
}

function renderGrid() {
  const grid = $('grid');
  grid.innerHTML = '';
  const msg = (t) => { const li = document.createElement('li'); li.className = 'empty'; li.textContent = t; grid.appendChild(li); };
  if (loading && !entries.length) return msg('Loading movies from Google Drive…');
  if (loadError) return msg(loadError);
  const q = norm($('search').value);
  const shown = entries.filter((e) => !q || norm(e.name).includes(q));
  if (!shown.length) return msg(entries.length ? 'No movies match your search.' : 'No videos found in the Movies folder.');
  shown.forEach((e) => {
    const li = document.createElement('li');
    li.className = 'card';
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Play ' + e.name);
    b.onclick = () => openEntry(e);
    b.appendChild(posterEl(e));
    const n = document.createElement('span'); n.className = 'name'; n.textContent = e.name; b.appendChild(n);
    if (e.videos.length > 1) {
      const m = document.createElement('span'); m.className = 'meta'; m.textContent = e.videos.length + ' videos'; b.appendChild(m);
    }
    li.appendChild(b);
    grid.appendChild(li);
  });
}

// ---------- Player ----------
const videoUrls = (f) => [
  'https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(f.id) + '?alt=media&key=' + KEY,
  'https://drive.usercontent.google.com/download?id=' + encodeURIComponent(f.id) + '&export=download&confirm=t',
];

function openEntry(e) {
  current = e;
  $('home').hidden = true;
  $('player').hidden = false;
  // resume the video you were last watching in this folder
  let start = 0;
  for (let i = 0; i < e.videos.length; i++) if (getPos(e.videos[i].id) > 5) start = i;
  play(start);
}

function closePlayer() {
  persistPos();
  video.pause();
  video.removeAttribute('src'); video.load();
  $('drive').src = 'about:blank';
  subToken++;
  $('player').hidden = true;
  $('home').hidden = false;
  current = null;
}

function play(i) {
  epIndex = i; urlIdx = 0; useDrive = false;
  const f = current.videos[i];
  $('title').textContent = current.videos.length > 1 ? current.name + ' — ' + fileTitle(f.name) : current.name;
  renderEpisodes();
  loadSubs(f);
  setSource();
}

function setSource() {
  const f = current.videos[epIndex];
  const fr = $('drive');
  if (useDrive) {
    video.pause(); video.removeAttribute('src'); video.load();
    video.hidden = true; fr.hidden = false;
    fr.src = 'https://drive.google.com/file/d/' + encodeURIComponent(f.id) + '/preview';
    $('driveBtn').textContent = 'Built-in player';
    $('driveBtn').classList.add('on');
    return;
  }
  fr.hidden = true; fr.src = 'about:blank';
  video.hidden = false;
  $('driveBtn').textContent = 'Drive player';
  $('driveBtn').classList.remove('on');
  video.src = videoUrls(f)[urlIdx];
  video.play().catch(() => {});
}

video.onerror = () => {
  if (!current || video.hidden || !video.getAttribute('src')) return;
  urlIdx++;
  if (urlIdx < videoUrls(current.videos[epIndex]).length) { setSource(); return; }
  useDrive = true;
  toast("Couldn't play this file directly, switched to Drive's player.");
  setSource();
};
$('driveBtn').onclick = () => { if (!current) return; persistPos(); useDrive = !useDrive; urlIdx = 0; setSource(); };
$('back').onclick = closePlayer;

let lastSaved = 0;
function persistPos() {
  if (!current || video.hidden || !video.duration) return;
  const id = current.videos[epIndex].id;
  if (video.currentTime > 5 && video.currentTime < video.duration - 30) savePos(id, video.currentTime);
  else savePos(id, null);
}
video.ontimeupdate = () => { if (Math.abs(video.currentTime - lastSaved) >= 5) { lastSaved = video.currentTime; persistPos(); } };
video.onpause = persistPos;
video.onloadedmetadata = () => {
  const id = current && current.videos[epIndex].id;
  const t = id ? getPos(id) : 0;
  if (t > 5 && t < video.duration - 30) { video.currentTime = t; toast('Resumed where you left off'); }
};
video.onended = () => {
  savePos(current.videos[epIndex].id, null);
  if (epIndex + 1 < current.videos.length) play(epIndex + 1);
};

function renderEpisodes() {
  const ul = $('eps');
  ul.innerHTML = '';
  ul.hidden = current.videos.length < 2;
  current.videos.forEach((f, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = i === epIndex ? 'cur' : '';
    b.innerHTML = '<span class="n"></span><span></span>';
    b.children[0].textContent = i + 1;
    b.children[1].textContent = fileTitle(f.name);
    b.onclick = () => { persistPos(); play(i); };
    li.appendChild(b);
    ul.appendChild(li);
  });
}

// ---------- Subtitles (.vtt or .srt next to the video) ----------
const srtToVtt = (t) => 'WEBVTT\n\n' + t.replace(/^\uFEFF/, '').replace(/\r+/g, '').replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, '$1.$2');
async function loadSubs(f) {
  video.querySelectorAll('track').forEach((t) => t.remove());
  blobUrls.splice(0).forEach((u) => URL.revokeObjectURL(u));
  const token = ++subToken;
  const base = f.name.replace(/\.[^.]+$/, '').toLowerCase();
  const subs = current.subs.filter((s) => current.videos.length === 1 || s.name.toLowerCase().startsWith(base));
  for (const s of subs) {
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/files/' + encodeURIComponent(s.id) + '?alt=media&key=' + KEY);
      if (!r.ok || token !== subToken) continue;
      let text = await r.text();
      if (token !== subToken) return;
      if (/\.srt$/i.test(s.name)) text = srtToVtt(text);
      const url = URL.createObjectURL(new Blob([text], { type: 'text/vtt' }));
      blobUrls.push(url);
      const stem = s.name.replace(/\.[^.]+$/, '');
      const tr = document.createElement('track');
      tr.kind = 'subtitles'; tr.srclang = 'en'; tr.src = url;
      tr.label = (stem.toLowerCase().startsWith(base) ? stem.slice(base.length).replace(/^[\s._-]+/, '') : stem) || 'Subtitles';
      video.appendChild(tr);
    } catch (e) {}
  }
}

// ---------- Wiring ----------
$('search').oninput = renderGrid;
$('refresh').onclick = () => { entries = []; load(true); };
window.addEventListener('keydown', (e) => {
  if ($('player').hidden || video.hidden || (e.target && e.target.tagName === 'INPUT')) return;
  if (e.code === 'Space') { e.preventDefault(); video.paused ? video.play() : video.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); video.currentTime = Math.max(0, video.currentTime - 10); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); video.currentTime += 10; }
  else if (e.key === 'f') { document.fullscreenElement ? document.exitFullscreen() : (video.requestFullscreen && video.requestFullscreen()); }
  else if (e.key === 'm') { video.muted = !video.muted; }
});
window.addEventListener('pagehide', persistPos);

renderGrid();
load();
</script>
</body>
</html>
